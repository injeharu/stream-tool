<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>到達祝福オーバーレイ</title>
<style>
  /* OBSブラウザソース用: 節目到達の祝福バナー(普段は何も表示しない) */
  body {
    margin: 0;
    background: transparent;
    font-family: "Segoe UI", "Yu Gothic UI", sans-serif;
    overflow: hidden;
  }
  #banner {
    display: none;
    width: 480px;
    margin: 10px auto;
    background: linear-gradient(135deg, rgba(145, 70, 255, 0.92), rgba(255, 92, 122, 0.92));
    border-radius: 16px;
    padding: 18px 26px;
    color: #fff;
    text-align: center;
    box-shadow: 0 6px 22px rgba(0, 0, 0, 0.5);
    animation: pop 0.5s ease;
  }
  #banner .big { font-size: 1.5rem; font-weight: 800; text-shadow: 0 2px 4px rgba(0,0,0,0.4); }
  #banner .sub { font-size: 1.0rem; margin-top: 4px; text-shadow: 0 1px 3px rgba(0,0,0,0.4); }
  @keyframes pop {
    0% { transform: scale(0.6); opacity: 0; }
    70% { transform: scale(1.06); }
    100% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>
<div id="banner">
  <div class="big">🎉 <span id="name"></span> さん</div>
  <div class="sub"><span id="detail"></span>到達おめでとうございます!</div>
</div>
<script>
  var lastId = null;
  var firstPoll = true;
  var SHOW_MS = 8000;

  function poll() {
    fetch("/api/overlay/latest_milestone")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.id === null) return;
        if (firstPoll) {
          // 起動時点の最新は「過去分」なので祝わない
          lastId = data.id;
          firstPoll = false;
          return;
        }
        if (data.id !== lastId) {
          lastId = data.id;
          document.getElementById("name").textContent = data.name;
          document.getElementById("detail").textContent = data.kind + data.threshold + "ヶ月";
          var banner = document.getElementById("banner");
          banner.style.display = "block";
          setTimeout(function () { banner.style.display = "none"; }, SHOW_MS);
        }
      })
      .catch(function () {});
  }

  poll();
  setInterval(poll, 5000);
</script>
</body>
</html>
